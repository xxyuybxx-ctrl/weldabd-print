<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>웰다 파트너코드 인쇄</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 왼쪽은 3단계 조작 패널(버전 → 코드 → 출력), 오른쪽은 A4 앞·뒷면 미리보기. 좁은 화면에서는 한 줄로 쌓인다. */
:root{
  color-scheme: light;
  --paper:#ffffff;
  --wash:#f5f5fb;
  --ink:#1c1a33;
  --muted:#66647f;
  --line:#dcdcec;
  --glp:#5b45d6;
  --glp-wash:#efedfd;
  --dm:#3462d9;
  --dm-wash:#eaf0fd;
  --code-red:#e3202b;
  --shadow:0 1px 2px rgba(28,26,51,.06), 0 8px 24px rgba(28,26,51,.08);
  --font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --fs-xs:12.5px; --fs-sm:14px; --fs-md:16px; --fs-lg:23px;
}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:var(--fs-sm);line-height:1.6;--accent:var(--glp);--accent-wash:var(--glp-wash)}
body[data-ver="dm"]{--accent:var(--dm);--accent-wash:var(--dm-wash)}
*{box-sizing:border-box}

.app{max-width:1120px;margin-inline:auto;padding-inline:20px;padding-block:28px 48px;display:grid;grid-template-columns:minmax(0,350px) minmax(0,1fr);gap:40px;align-items:start}
.panel{display:flex;flex-direction:column;gap:26px;min-width:0}
.head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:var(--fs-xs);font-weight:700;letter-spacing:.04em;color:var(--accent)}
h1{margin:0;font-size:var(--fs-lg);font-weight:800;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.lede{margin:0;color:var(--muted)}

.step{display:flex;flex-direction:column;gap:10px;border:0;margin:0;padding:0;min-width:0}
.step-title{display:flex;align-items:center;gap:8px;padding:0;font-size:var(--fs-sm);font-weight:700}
.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--paper);font-size:var(--fs-xs);font-weight:800;font-variant-numeric:tabular-nums}

.vers{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.ver.ver-mini{align-self:flex-end;flex-direction:row;padding:3px 8px;border:1px solid transparent;border-radius:6px;background:transparent;font-size:11.5px;color:#a3a2b6;font-weight:500}
.ver.ver-mini:hover{color:var(--muted)}
.ver.ver-mini:has(input:checked){border-color:var(--accent);background:var(--accent-wash);color:var(--accent);font-weight:700}
.ver{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);cursor:pointer;min-width:0}
.ver input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ver b{font-size:var(--fs-sm);font-weight:700}
.ver span{font-size:var(--fs-xs);color:var(--muted)}
.ver:has(input:checked){border-color:var(--accent);background:var(--accent-wash)}
.ver:has(input:checked) b{color:var(--accent)}
.ver:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}

.code-input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-family:var(--font);font-size:22px;font-weight:800;color:var(--code-red);letter-spacing:.01em}
.code-input::placeholder{color:#b9b8cb;font-weight:500}
.code-input:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.zoom{display:flex;flex-direction:column;gap:6px;margin:0}
.zoom canvas{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:var(--wash)}
.zoom figcaption{font-size:var(--fs-xs);color:var(--muted)}

.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{flex:1 1 140px;padding:13px 16px;border:1.5px solid var(--accent);border-radius:10px;background:var(--accent);color:var(--paper);font-family:var(--font);font-size:var(--fs-md);font-weight:700;cursor:pointer}
.btn.ghost{background:var(--paper);color:var(--accent)}
.btn:hover{filter:brightness(1.07)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.status{margin:0;min-height:1.6em;font-size:var(--fs-sm);font-weight:500;color:var(--ink)}
.status[data-kind="err"]{color:var(--code-red)}
.notice{margin:0;padding:11px 14px;border-radius:10px;background:var(--accent-wash);color:var(--accent);font-size:var(--fs-sm);font-weight:700;line-height:1.5}
.quality{margin:0;font-size:var(--fs-xs);color:var(--muted)}

.tips{margin:0;padding:14px 16px;background:var(--wash);border-radius:10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:var(--fs-xs)}
.tips dt{color:var(--muted)}
.tips dd{margin:0;font-weight:700}

.preview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;min-width:0}
.sheet{display:flex;flex-direction:column;gap:8px;margin:0;min-width:0}
.sheet figcaption{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:var(--fs-xs);color:var(--muted)}
.sheet figcaption b{font-size:var(--fs-sm);color:var(--ink);font-weight:700}
.sheet canvas,.sheet img{display:block;width:100%;height:auto;aspect-ratio:210/297;background:var(--wash);border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow)}

.print-frame{position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:28px;padding-inline:16px;padding-block:20px 40px}
  .preview{gap:12px}
}
</style>
</head>
<body>

<main class="app">
  <section class="panel" aria-label="인쇄 설정">
    <header class="head">
      <span class="eyebrow">웰다 1장 BD</span>
      <h1>웰다 파트너코드 인쇄</h1>
      <p class="lede">병원 파트너 코드를 넣으면 생활습관 가이드 앞면에 빨간 글씨로 들어갑니다. 뒷면은 앱 설치 가이드입니다.</p>
    </header>

    <fieldset class="step">
      <legend class="step-title"><span class="num">1</span>버전 선택</legend>
      <div class="vers">
        <label class="ver"><input type="radio" name="ver" id="ver-glp" value="glp" checked><b>비만주사 (GLP-1)</b><span>비만주사 치료 환자용</span></label>
        <label class="ver ver-mini"><input type="radio" name="ver" id="ver-dm" value="dm">전당뇨·당뇨 버전</label>
      </div>
    </fieldset>

    <div class="step">
      <label class="step-title" for="code"><span class="num">2</span>병원 파트너 코드</label>
      <input class="code-input" id="code" type="text" maxlength="30" autocomplete="off" spellcheck="false" placeholder="예: 대웅의원1004">
      <figure class="zoom">
        <canvas id="zoom" width="900" height="430" role="img" aria-label="코드가 들어간 칸 확대 미리보기"></canvas>
        <figcaption>코드 칸 확대. 비워 두면 빈칸으로 나옵니다.</figcaption>
      </figure>
    </div>

    <div class="step">
      <div class="step-title"><span class="num">3</span>출력</div>
      <div class="actions">
        <button class="btn" id="btn-print" type="button">바로 인쇄</button>
        <button class="btn" id="btn-pdf" type="button">PDF 저장</button>
      </div>
      <p class="notice">앞장과 뒷장의 상단·하단 위치가 동일하도록 양면으로 인쇄하세요.</p>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="quality">출력물은 디자인 원본(벡터)으로 만들어 글자와 선이 확대해도 깨지지 않습니다. 화면 미리보기만 저해상도입니다.</p>
    </div>
  </section>

  <section class="preview" aria-label="인쇄 미리보기">
    <figure class="sheet">
      <figcaption><b>앞면</b><span id="front-cap">비만주사 생활습관 가이드</span></figcaption>
      <canvas id="front" width="1240" height="1754" role="img" aria-label="앞면 미리보기"></canvas>
    </figure>
    <figure class="sheet">
      <figcaption><b>뒷면</b><span>앱 설치 가이드</span></figcaption>
      <img id="back" alt="뒷면 앱 설치 가이드 미리보기">
    </figure>
  </section>
</main>
<iframe class="print-frame" id="print-frame" title="인쇄용" aria-hidden="true" tabindex="-1"></iframe>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(function(){
  var STANDALONE = true;
  var RED = '#e3202b';
  var FONT = '"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  // 좌표 단위: PDF pt(1/72인치), 페이지 왼쪽 위 기준
  var VERS = {
    glp:{name:'비만주사 생활습관 가이드', file:'비만주사', pdf:'assets/glp.pdf', front:'assets/glp_front.jpg', back:'assets/glp_back.jpg',
         pw:595, ph:842, box:{x0:369.12,x1:558.72,y0:741.12,y1:815.76}, labelBottom:764.88,
         qr:{x0:30.48,y0:746.4,x1:96.48,y1:812.64}, qrBg:[251,251,251]},
    dm: {name:'전당뇨·당뇨 생활습관 가이드', file:'당뇨', pdf:'assets/dm.pdf', front:'assets/dm_front.jpg', back:'assets/dm_back.jpg',
         pw:594.96, ph:841.92, box:{x0:372.0,x1:559.2,y0:750.72,y1:825.6}, labelBottom:770.88,
         qr:{x0:44.4,y0:759.12,x1:102.72,y1:817.44}, qrBg:[250,250,250]}
  };
  var QR_SRC = 'assets/qr_welday.png';

  var $ = function(id){ return document.getElementById(id); };
  var front = $('front'), zoom = $('zoom'), codeEl = $('code'), statusEl = $('status');
  var fctx = front.getContext('2d'), zctx = zoom.getContext('2d');
  var state = { ver:'glp', code:'' };
  var imgs = {};
  ['glp','dm'].forEach(function(k){ var im = new Image(); im.onload = function(){ if(state.ver===k) draw(); }; im.src = VERS[k].front; imgs[k] = im; });

  function codeText(){ return state.code.replace(/\s+/g,' ').trim(); }

  // 코드 글자 영역(pt): 라벨 아래 ~ 칸 아래쪽, 좌우 여백
  function textRect(v){
    var b = v.box;
    return { x:b.x0 + 11, y:v.labelBottom + 2.6, w:(b.x1 - b.x0) - 22, h:(b.y1 - 6) - (v.labelBottom + 2.6) };
  }
  // ctx 위에 (x,y,w,h) 픽셀 영역 안에 코드를 가운데 정렬로 그린다
  function paintCode(ctx, x, y, w, h, t){
    var size = h * 0.64;
    ctx.font = '800 ' + size + 'px ' + FONT;
    var m = ctx.measureText(t);
    if(m.width > w){ size = Math.max(size * 0.34, size * w / m.width); ctx.font = '800 ' + size + 'px ' + FONT; m = ctx.measureText(t); }
    var asc = m.actualBoundingBoxAscent || size * 0.8, desc = m.actualBoundingBoxDescent || 0;
    ctx.fillStyle = RED; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(t, x + w / 2, y + h / 2 + (asc - desc) / 2, w);
  }

  function draw(){
    var v = VERS[state.ver], im = imgs[state.ver];
    if(!im.complete || !im.naturalWidth) return;
    var s = front.width / v.pw;
    fctx.setTransform(1,0,0,1,0,0);
    fctx.imageSmoothingQuality = 'high';
    fctx.drawImage(im, 0, 0, front.width, front.height);
    var t = codeText();
    if(t){ var r = textRect(v); paintCode(fctx, r.x * s, r.y * s, r.w * s, r.h * s, t); }
    var b = v.box;
    var cx0 = Math.max(0, b.x0 - 18), cx1 = Math.min(v.pw, b.x1 + 18), cy0 = b.y0 - 12, cy1 = Math.min(v.ph, b.y1 + 12);
    zoom.width = 900; zoom.height = Math.round(900 * (cy1 - cy0) / (cx1 - cx0));
    zctx.imageSmoothingQuality = 'high';
    zctx.drawImage(front, cx0 * s, cy0 * s, (cx1 - cx0) * s, (cy1 - cy0) * s, 0, 0, zoom.width, zoom.height);
  }

  // 한글 웹폰트는 글자 묶음별로 내려받으므로, 입력한 글자에 맞는 묶음이 준비되면 다시 그린다.
  function ensureFont(){
    var t = codeText();
    if(!t || !document.fonts || !document.fonts.load) return Promise.resolve();
    var wait = new Promise(function(r){ setTimeout(r, 2500); });
    return Promise.race([document.fonts.load('800 40px "Noto Sans KR"', t).catch(function(){}), wait]);
  }
  function refresh(){ draw(); var t = codeText(); ensureFont().then(function(){ if(codeText() === t) draw(); }); }
  function say(msg, kind){ statusEl.textContent = msg || ''; if(kind) statusEl.dataset.kind = kind; else delete statusEl.dataset.kind; }

  function setVer(k){
    state.ver = k; document.body.dataset.ver = k;
    $('front-cap').textContent = VERS[k].name; $('back').src = VERS[k].back;
    refresh();
  }
  codeEl.addEventListener('input', function(){ state.code = codeEl.value; say(''); refresh(); });
  ['ver-glp','ver-dm'].forEach(function(id){
    $(id).addEventListener('change', function(e){
      if(!e.target.checked) return;
      say(''); setVer(e.target.value);
      try{ localStorage.setItem('welda-bd-ver', state.ver); }catch(_){}
    });
  });
  try{ if(localStorage.getItem('welda-bd-ver') === 'dm') $('ver-dm').checked = true; }catch(_){}
  state.code = codeEl.value || '';
  setVer($('ver-dm').checked ? 'dm' : 'glp');
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

  // ---- 고화질 PDF: 원본 벡터 페이지 위에 QR과 코드만 얹는다 ----
  var cache = {};
  function getBytes(url){
    if(!cache[url]) cache[url] = fetch(url).then(function(r){ if(!r.ok) throw { code:'fetch' }; return r.arrayBuffer(); })
      .catch(function(e){ delete cache[url]; throw (e && e.code) ? e : { code:'fetch' }; });
    return cache[url];
  }
  function codePng(v, t){
    var r = textRect(v), k = 8;                       // 8px/pt ≈ 576dpi
    var c = document.createElement('canvas'); c.width = Math.round(r.w * k); c.height = Math.round(r.h * k);
    paintCode(c.getContext('2d'), 0, 0, c.width, c.height, t);
    return new Promise(function(res){ c.toBlob(function(b){ b.arrayBuffer().then(res); }, 'image/png'); });
  }
  function buildPdf(){
    var v = VERS[state.ver], t = codeText();
    if(!window.PDFLib) return Promise.reject({ code:'no_lib' });
    var L = window.PDFLib;
    return Promise.all([getBytes(v.pdf), getBytes(QR_SRC), t ? codePng(v, t) : null]).then(function(a){
      return L.PDFDocument.load(a[0]).then(function(src){
        return L.PDFDocument.create().then(function(out){
          return out.copyPages(src, [0, 1]).then(function(pages){
            pages.forEach(function(p){ out.addPage(p); });
            var p = pages[0], H = p.getHeight();
            return Promise.all([out.embedPng(a[1]), a[2] ? out.embedPng(a[2]) : null]).then(function(img){
              var q = v.qr, pad = 3, bg = v.qrBg;
              p.drawRectangle({ x:q.x0 - pad, y:H - q.y1 - pad, width:(q.x1 - q.x0) + pad * 2, height:(q.y1 - q.y0) + pad * 2, color:L.rgb(bg[0]/255, bg[1]/255, bg[2]/255) });
              p.drawImage(img[0], { x:q.x0, y:H - q.y1, width:q.x1 - q.x0, height:q.y1 - q.y0 });
              if(img[1]){ var r = textRect(v); p.drawImage(img[1], { x:r.x, y:H - r.y - r.h, width:r.w, height:r.h }); }
              out.setTitle('웰다 ' + v.file + ' 생활습관 가이드' + (t ? ' - ' + t : ''));
              return out.save();
            });
          });
        });
      });
    }).then(function(bytes){ return new Blob([bytes], { type:'application/pdf' }); });
  }
  function fileName(){
    var t = codeText().replace(/[\\\/:*?"<>|\[\]]/g,'').trim();
    return '웰다_' + VERS[state.ver].file + '_' + (t || '코드없음') + '.pdf';
  }
  function errMsg(e){
    var c = e && e.code;
    if(c === 'declined') return ['저장을 취소했습니다.'];
    if(c === 'rate_limited') return ['저장 창이 이미 열려 있습니다. 잠시 뒤 다시 눌러 주세요.', 'err'];
    if(c === 'no_lib') return ['PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.', 'err'];
    if(c === 'fetch') return ['디자인 원본 파일을 불러오지 못했습니다. 새로고침 후 다시 눌러 주세요.', 'err'];
    if(c === 'unavailable' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return ['이 화면에서는 PDF 저장을 쓸 수 없습니다.', 'err'];
    return ['PDF를 만들지 못했습니다. 다시 눌러 주세요.', 'err'];
  }

  var downloads = STANDALONE ? Promise.resolve(null)
    : (window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(null));
  var btnPdf = $('btn-pdf');
  if(STANDALONE){ btnPdf.classList.add('ghost'); }
  else downloads.then(function(d){ if(!d){ btnPdf.disabled = true; say('이 화면에서는 PDF 저장을 쓸 수 없습니다.', 'err'); } });

  btnPdf.addEventListener('click', function(){
    btnPdf.disabled = true; say('고화질 PDF를 만드는 중입니다.');
    ensureFont().then(buildPdf).then(function(blob){
      var name = fileName();
      if(STANDALONE){
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 60000);
        return;
      }
      return downloads.then(function(d){ if(!d) throw { code:'unavailable' }; return d.save({ filename:name, data:blob }); });
    }).then(function(){
      say('PDF를 저장했습니다. 파일을 열어 양면으로 인쇄하세요.');
    }).catch(function(e){ var m = errMsg(e); say(m[0], m[1]); })
      .then(function(){ btnPdf.disabled = false; });
  });

  var btnPrint = $('btn-print'), frame = $('print-frame'), lastUrl = null;
  if(btnPrint){
    btnPrint.addEventListener('click', function(){
      btnPrint.disabled = true; say('인쇄용 고화질 PDF를 만드는 중입니다.');
      ensureFont().then(buildPdf).then(function(blob){
        if(lastUrl) URL.revokeObjectURL(lastUrl);
        lastUrl = URL.createObjectURL(blob);
        return new Promise(function(res){
          var done = false;
          setTimeout(function(){ if(!done){ done = true; res('tab'); } }, 6000);
          frame.onload = function(){
            if(done) return; done = true;
            setTimeout(function(){
              try{ frame.contentWindow.focus(); frame.contentWindow.print(); res('frame'); }
              catch(_){ res('tab'); }
            }, 400);
          };
          frame.src = lastUrl;
        });
      }).then(function(how){
        if(how === 'tab'){
          var w = window.open(lastUrl, '_blank');
          say(w ? '새 탭에서 PDF가 열렸습니다. 그 탭에서 인쇄하세요.' : 'PDF 저장을 눌러 파일로 인쇄해 주세요.', w ? null : 'err');
        } else say('인쇄 창에서 양면 인쇄, 긴 쪽으로 넘김을 선택하세요.');
      }).catch(function(e){ var m = errMsg(e); say(m[0], m[1]); })
        .then(function(){ btnPrint.disabled = false; });
    });
  }
})();
</script>
</body>
</html>
